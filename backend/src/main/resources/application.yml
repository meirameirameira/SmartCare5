spring:
  application:
    name: smarthas-api
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: always

smarthas:
  jwt:
    # Em producao defina SMARTHAS_JWT_SECRET (minimo 32 caracteres).
    secret: ${SMARTHAS_JWT_SECRET:troque-este-segredo-de-desenvolvimento-smarthas-2026}
    issuer: smart-has-api
    expiration-minutes: 480
  cors:
    # Origens de desenvolvimento: dashboard Angular, Flutter Web e Metro.
    allowed-origins:
      - http://localhost:4200
      - http://localhost:8081
      - http://localhost:3000
      - http://localhost:8090

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
  api-docs:
    path: /v3/api-docs

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

logging:
  level:
    com.smarthas.api: INFO

---
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: jdbc:h2:file:./data/smarthas;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  h2:
    console:
      enabled: true
      path: /h2-console

---
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USER}
    password: ${DATABASE_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
